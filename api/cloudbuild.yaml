# Builds the API image, runs database migrations (once Cloud SQL exists) and deploys it to
# Cloud Run. The deploy job in .github/workflows/ci.yml submits it on every push to main:
#   gcloud builds submit api --config=api/cloudbuild.yaml --substitutions=_TAG=<git sha>
substitutions:
  _REGION: europe-west1
  _SERVICE: vyro-api
  _TAG: manual
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/vyro/api:${_TAG}

options:
  dynamicSubstitutions: true
  # Required when the build runs as a user-specified service account.
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if gcloud run jobs describe vyro-migrate --region=${_REGION} >/dev/null 2>&1; then
          gcloud run jobs update vyro-migrate --region=${_REGION} --image=${_IMAGE} --quiet
          gcloud run jobs execute vyro-migrate --region=${_REGION} --wait
        else
          echo "No vyro-migrate job yet (Cloud SQL is not set up); skipping migrations"
        fi

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --service-account=vyro-api@${PROJECT_ID}.iam.gserviceaccount.com
      # Public: the API authenticates every /v1 request with a Firebase ID token itself.
      - --allow-unauthenticated
      - --set-env-vars=VYRO_ENV=prod,VYRO_AUTH_MODE=firebase,VYRO_FIREBASE_PROJECT_ID=${PROJECT_ID}
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=3
      - --quiet

# Local development: Postgres, and the API running against it.
#   docker compose up -d          # both; they then restart with Docker, so this is a one-time step
#   docker compose up -d db       # only the database (for pytest, or uvicorn from your venv)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vyro
      POSTGRES_PASSWORD: vyro
      POSTGRES_DB: vyro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the vyro_test database the API tests use.
      - ./infra/local/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyro -d vyro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # The API on http://localhost:8000, so the app can use real data without a mock server.
  # It applies migrations on start and reloads when files in api/app change. After changing
  # dependencies in pyproject.toml, rebuild it: docker compose up -d --build api
  api:
    build: ./api
    # Root, so it can write proof photos to the mounted api/.uploads. Local only.
    user: root
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      VYRO_ENV: local
      VYRO_AUTH_MODE: dev
      VYRO_DATABASE_URL: postgresql+psycopg://vyro:vyro@db:5432/vyro
      # Changes made on Windows don't reach the container as file events, so poll for them.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/srv/app
      - ./api/alembic:/srv/alembic
      - ./api/scripts:/srv/scripts
      - ./api/.uploads:/srv/.uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

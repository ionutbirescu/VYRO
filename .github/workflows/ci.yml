name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vyro
          POSTGRES_PASSWORD: vyro
          POSTGRES_DB: vyro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vyro -d vyro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VYRO_DATABASE_URL: postgresql+psycopg://vyro:vyro@localhost:5432/vyro_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock
      - run: pip install -c requirements.lock -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations match the models
        run: alembic upgrade head && alembic check
      - name: Tests
        run: pytest
      - name: Contract is up to date
        run: python scripts/export_openapi.py --check
      - name: Image builds
        run: docker build --tag vyro-api:ci .

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: API types match the contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  deploy:
    name: Deploy API
    needs: api
    # Only main deploys. Google Cloud only trusts tokens for main (see infra/setup-gcp.sh).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and deploy with Cloud Build
        run: >-
          gcloud builds submit api
          --project=${{ vars.GCP_PROJECT_ID }}
          --config=api/cloudbuild.yaml
          --service-account=projects/${{ vars.GCP_PROJECT_ID }}/serviceAccounts/${{ vars.GCP_DEPLOY_SA }}
          --gcs-source-staging-dir=gs://${{ vars.GCP_PROJECT_ID }}_cloudbuild/source
          --substitutions=_TAG=${{ github.sha }}
